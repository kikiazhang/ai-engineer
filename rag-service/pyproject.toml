[project]
name = "rag-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kikiazhang", email = "kikiazhang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.22.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[project.scripts]
rag-service = "rag_service:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.uv.build-backend]
module-name = "rag_service"
module-root = "src"

[tool.uv]
package = true
