[project]
name = "python-foundations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kikiazhang", email = "kikiazhang@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
python-foundations = "python_foundations:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
